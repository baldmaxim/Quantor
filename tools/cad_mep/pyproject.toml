[project]
name = "cad-mep"
version = "0.1.0"
description = "Генератор трасс механики (ОВ, ВПВ/АУП, ВК) по плану этажа: PDF + DXF вида -> 3D DXF, превью и кандидат (ADR-0036 п.8)."
requires-python = ">=3.12"
# Запускается внутри окружения CAD-движка (lock tools/cad_engine): numpy, shapely, ezdxf, pymupdf. scipy нет.
dependencies = ["numpy", "shapely", "ezdxf", "pymupdf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "RUF001",  # документация и комментарии на русском: кириллица не «неоднозначный символ»
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["cad_mep"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["cad_mep", "run_mep.py", "run_zones.py", "tests"]

[[tool.mypy.overrides]]
# У PyMuPDF нет полных аннотаций.
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Вызовы PyMuPDF не аннотированы (чтение страницы и текста, синтетический PDF в тестах).
module = ["cad_mep.pdfsrc", "cad_mep.elevations", "tests.synth", "tests.test_elevations"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
