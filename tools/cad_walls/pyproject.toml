[project]
name = "cad-walls"
version = "0.1.0"
description = "Конструкции кладки и монолита по DXF вида CAD-движка: участки одной толщины, номиналы, проёмы, walls.json (ADR-0038 п.2-3)."
requires-python = ">=3.12"
# Запускается внутри окружения CAD-движка (lock tools/cad_engine): numpy, shapely, ezdxf, pymupdf. scipy нет.
# Высоты этажа берутся разбором заголовков планов из tools/cad_mep (cad_mep.elevations).
dependencies = ["numpy", "shapely", "ezdxf", "pymupdf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "RUF001",  # документация и комментарии на русском: кириллица не «неоднозначный символ»
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["cad_walls", "cad_mep"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["cad_walls", "run_walls.py", "tests"]
mypy_path = "../cad_mep"

[[tool.mypy.overrides]]
# У PyMuPDF и Shapely нет полных аннотаций.
module = ["pymupdf", "pymupdf.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Вызовы PyMuPDF не аннотированы (чтение страницы, синтетический PDF в тестах).
module = ["cad_walls.heights", "tests.synth", "tests.test_heights", "cad_mep.elevations"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "../cad_mep"]
