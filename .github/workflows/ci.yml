name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  web:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Единый стиль форматирования
        run: pnpm run lint:format
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    name: Бэкенд
    runs-on: ubuntu-latest
    # Тесты базы данных должны выполняться по-настоящему, иначе они молча пропускаются.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: quantor
          POSTGRES_USER: quantor
          POSTGRES_PASSWORD: quantor_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantor -d quantor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_PASSWORD: quantor_ci_password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Установка зависимостей
        run: pip install --editable '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Тесты
        # Тесты базы данных умеют пропускаться на машине без PostgreSQL. В CI база есть,
        # поэтому пропуск означает поломку окружения, а не отсутствие инфраструктуры.
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee pytest.log
          if grep -q "PostgreSQL недоступен" pytest.log; then
            echo "::error::Тесты базы данных пропущены — база в CI недоступна"
            exit 1
          fi

  contract:
    name: Контракт API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pnpm install --frozen-lockfile
      - name: Окружение Python
        run: pnpm run setup
      - name: OpenAPI и клиент синхронны с кодом
        run: pnpm run api-client:check

  migrations:
    name: Миграции
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: quantor
          POSTGRES_USER: quantor
          POSTGRES_PASSWORD: quantor_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantor -d quantor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_PASSWORD: quantor_ci_password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install --editable '.[dev]'
      - name: Миграции накатываются на пустую базу
        run: alembic upgrade head
      - name: Миграции соответствуют моделям
        run: alembic check
      - name: Откат миграций работает
        run: alembic downgrade base
