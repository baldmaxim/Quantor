[project]
name = "quantor-api"
version = "0.1.0"
description = "Quantor / QTO Portal — backend API (Stage 1: оболочка, без QTO-логики)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "aioboto3==15.5.0",
    "structlog==26.1.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    # Проверка подписи токенов провайдера входа. Не SDK вендора: контракт OIDC один,
    # а привязка к конкретному провайдеру осталась бы навсегда (ADR-0012).
    "pyjwt[crypto]==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "types-aioboto3[s3]==15.5.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",              # assert — нормальная форма проверки в тестах
    "RUF001",            # документация и комментарии на русском: кириллица не "неоднозначный символ"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# В репозитории есть каталог alembic/, иначе ruff считает пакет alembic первой стороной.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
