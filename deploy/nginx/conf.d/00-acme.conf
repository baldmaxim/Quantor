# HTTP: подтверждение Let's Encrypt и переадресация на HTTPS для всех имён.
# Этот файл — единственный, что нужен до выпуска сертификата: с ним nginx поднимается
# без TLS, certbot подтверждает домены, и только потом кладётся quantor.conf.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
