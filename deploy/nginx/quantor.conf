# Quantor: портал, API, файлы и контур управления (ADR-0032).
# Кладётся в /opt/infra/nginx/conf.d/ ПОСЛЕ выпуска сертификата — см. deploy/README.md.
#
#   quantor.meridianai.ru          /                 → quantor-web:3000
#                                  /api/, /health/   → quantor-api:8000
#                                  /quantor-files/   → quantor-minio:9000 (только GET/HEAD)
#   admin.quantor.meridianai.ru    /                 → quantor-admin:3001
#
# Откат: удалить файл, `nginx -t`, `nginx -s reload`.

# Вход и регистрация — медленнее всего остального: перебор паролей упирается сюда раньше,
# чем в блокировку учётной записи на сервере.
limit_req_zone $binary_remote_addr zone=quantor_auth:10m rate=10r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name quantor.meridianai.ru;

    ssl_certificate     /etc/letsencrypt/live/quantor.meridianai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantor.meridianai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:quantor_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Всё, кроме загрузки файлов: JSON-тела API не больше четырёх мегабайт.
    client_max_body_size 10m;

    # Адрес клиента перезаписывается, а не дописывается: nginx — первый хоп, и цепочку,
    # присланную клиентом, принимать нельзя — ею подделали бы IP в журнале аудита.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Схема API и Swagger в бою не публикуются: клиент генерируется при сборке.
    location = /api/docs         { return 404; }
    location = /api/openapi.json { return 404; }

    # Загрузка документов: до гигабайта (max_upload_size_bytes) с запасом на multipart.
    # Тело идёт в API потоком, без буфера на диске nginx.
    location ~ ^/api/v1/projects/[^/]+/uploads$ {
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        set $quantor_api quantor-api:8000;
        proxy_pass http://$quantor_api$request_uri;
    }

    location /api/v1/auth/ {
        limit_req zone=quantor_auth burst=10 nodelay;
        limit_req_status 429;
        set $quantor_api quantor-api:8000;
        proxy_pass http://$quantor_api$request_uri;
    }

    location /api/ {
        proxy_read_timeout 120s;
        set $quantor_api quantor-api:8000;
        proxy_pass http://$quantor_api$request_uri;
    }

    location /health/ {
        set $quantor_api quantor-api:8000;
        proxy_pass http://$quantor_api$request_uri;
    }

    # Файлы ревизий по подписанным ссылкам. Подпись SigV4 включает хост, поэтому Host
    # передаётся как есть. Только чтение: запись в хранилище снаружи закрыта здесь,
    # а не только подписью.
    #
    # Заголовки повторены целиком: свой proxy_set_header в location отменяет наследование
    # серверных, и без повтора MinIO получил бы Host: quantor-minio:9000 — подпись не сошлась бы.
    location /quantor-files/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        # Cookie портала хранилищу не нужны: доступ даёт подпись в адресе.
        proxy_set_header Cookie            "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        set $quantor_minio quantor-minio:9000;
        proxy_pass http://$quantor_minio$request_uri;
    }

    location / {
        set $quantor_web quantor-web:3000;
        proxy_pass http://$quantor_web$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.quantor.meridianai.ru;

    ssl_certificate     /etc/letsencrypt/live/quantor.meridianai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantor.meridianai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:quantor_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        set $quantor_admin quantor-admin:3001;
        proxy_pass http://$quantor_admin$request_uri;
    }
}
