# Ingress сервера Quantor: nginx с TLS и certbot (ADR-0032).
#
# Живёт в /opt/infra/nginx отдельным проектом и обновляется отдельно от портала: выкладка
# новой версии Quantor не перезапускает вход. Сеть infra_web общая с порталом:
#   docker network create infra_web

name: infra-nginx

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: infra-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks: [infra_web]
    restart: unless-stopped
    # Перечитывает сертификаты раз в шесть часов: certbot продлевает их сам, а nginx
    # без перезагрузки продолжал бы отдавать старый.
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    mem_limit: 64m

  certbot:
    image: certbot/certbot:v5.8.0
    container_name: infra-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    mem_limit: 128m

networks:
  infra_web:
    external: true
